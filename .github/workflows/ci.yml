name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Install Windows audio test tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed.' }
          python -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp installation failed.' }
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux audio test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python3 -m venv "$RUNNER_TEMP/yt-dlp-env"
          "$RUNNER_TEMP/yt-dlp-env/bin/python" -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
          echo "$RUNNER_TEMP/yt-dlp-env/bin" >> "$GITHUB_PATH"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check public source for secrets
        run: npm run scan:secrets
      - name: Run unit and local audio integration tests
        run: npm test
