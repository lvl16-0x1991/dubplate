name: Windows release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Require tag to match package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version){console.error('Tag must equal v'+p.version);process.exit(1)}"
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Install audio test tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed.' }
          python -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp installation failed.' }
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check public source for secrets
        run: npm run scan:secrets
      - name: Run tests
        run: npm test
      - name: Build per-user NSIS installer
        run: npm run dist
      - name: Preserve unsigned installer for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dubplate-unsigned-installer
          if-no-files-found: error
          retention-days: 1
          path: dist/Dubplate-Setup-*.exe

  sign:
    name: Optionally sign and checksum installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - name: Retrieve unsigned installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dubplate-unsigned-installer
          path: dist
      - name: Choose optional signing mode
        id: signing
        shell: node {0}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          const fs = require('node:fs');
          const required = ['AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT_NAME', 'AZURE_SIGNING_CERTIFICATE_PROFILE'];
          const missing = required.filter((name) => !process.env[name]?.trim());
          const enabled = missing.length === 0;
          if (enabled) {
            let endpoint;
            try { endpoint = new URL(process.env.AZURE_SIGNING_ENDPOINT); } catch { throw new Error('Azure signing endpoint must be a valid HTTPS regional URL.'); }
            if (endpoint.protocol !== 'https:' || !/^[a-z0-9-]+\.codesigning\.azure\.net$/.test(endpoint.hostname) || endpoint.port || endpoint.username || endpoint.password || endpoint.pathname !== '/' || endpoint.search || endpoint.hash) throw new Error('Azure signing endpoint must be the HTTPS regional codesigning.azure.net endpoint.');
            for (const name of ['AZURE_TENANT_ID', 'AZURE_CLIENT_ID']) if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(process.env[name])) throw new Error(name + ' must be a GUID.');
          }
          const summary = enabled ? 'Azure Artifact Signing is enabled. Signing or verification failure will stop this release.' : 'Publishing an unsigned installer. Optional Azure signing configuration is ' + (missing.length === required.length ? 'not set.' : 'incomplete; missing secret names: ' + missing.join(', ') + '.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=' + enabled + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          console.log(summary);
      - name: Select the single installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dist' -Filter 'Dubplate-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Dubplate Setup executable.' }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign installer with Azure Artifact Signing
        if: steps.signing.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ steps.installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false
          trace: false
      - name: Verify signed installer and timestamp
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:SIGNING_INSTALLER
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw 'The installer must have a valid Authenticode signature and timestamp before release.'
          }
          'Installer Authenticode signature and timestamp verified.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Create installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dist' -Filter 'Dubplate-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Dubplate Setup executable.' }
          $installer = $installers[0]
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath 'dist/SHA256SUMS' -Encoding ascii
      - name: Preserve only installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dubplate-windows-installer
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Dubplate-Setup-*.exe
            dist/SHA256SUMS

  publish:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Retrieve verified build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dubplate-windows-installer
          path: release
      - name: Publish installer and checksum
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/Dubplate-Setup-*.exe
            release/SHA256SUMS
